{% extends 'base.html' %}
{% block body %}
<div class="page-container">
    <div class="card">
        <h1>Ask SAGE</h1>

        <form method="POST">
            <input type="text" name="query" placeholder="Ask a question...">
            <button type="submit">Send</button>
        </form>

        {% if answer %}
            {% if answer.success %}
                {% for result in answer.results %}
                    <div class="result-item">
                        <p>{{ result.chunk }}</p>
                        <small>Score: {{ result.final_score }}</small>
                    </div>
                {% endfor %}
            {% else %}
                <p>Error: {{ answer.error }}</p>
            {% endif %}
        {% endif %}
    </div>
</div>
{% endblock %}
