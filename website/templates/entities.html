{% extends 'base.html' %}
{% block body %}
<h1>Explore Entities</h1>

<form method="GET">
    <input type="text" name="name" value="{{ query }}" placeholder="Entity name (e.g. P-101)">
    <button type="submit">Search</button>
</form>

{% if report %}
    {% if report.success %}
        <h3>{{ report.report.equipment }}</h3>
        <p>Status: {{ report.report.status }}</p>
        <p>Root causes: {{ report.report.root_causes }}</p>
    {% else %}
        <p>Error: {{ report.error }}</p>
    {% endif %}
{% endif %}
{% endblock %}
